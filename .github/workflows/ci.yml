name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Pinned: the legacy baseline in pyproject.toml was taken with this version.
      - run: pip install ruff==0.17.1
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The static export contract runs the browser code with node (tests/test_static_export.py).
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov ruff==0.17.1
      - run: pytest --tb=short -q

  contract-tests:
    name: Contract Tests
    # No database server: the contracts are checked against service functions reading a
    # DuckDB file built from synthetic fixture Parquet (tests/site_data.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The data layer's pins from requirements.txt, without the old stack's packages.
      - run: |
          grep -E '^(duckdb|requests)==' requirements.txt > "$RUNNER_TEMP/data-requirements.txt"
          pip install pytest -r "$RUNNER_TEMP/data-requirements.txt"
      - run: pytest tests/contracts -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
