name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-lint:
    name: Backend Lint
    # My Homeberry self-hosted runner: this repo is private, so no GitHub-hosted minutes.
    runs-on: [self-hosted, homeberry]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned: the legacy baseline in pyproject.toml was taken with this version.
      - run: pip install ruff==0.17.1
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    name: Backend Tests
    # My Homeberry self-hosted runner: this repo is private, so no GitHub-hosted minutes.
    runs-on: [self-hosted, homeberry]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: parliament_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov ruff==0.17.1
      - run: pytest --tb=short -q
        env:
          DATABASE_TYPE: postgresql
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: test
          PG_PASSWORD: test
          PG_DATABASE: parliament_test

  contract-tests:
    name: Contract Tests
    # My Homeberry self-hosted runner: this repo is private, so no GitHub-hosted minutes.
    # No database: the contracts are checked against service functions and fixtures.
    runs-on: [self-hosted, homeberry]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest tests/contracts -v

  frontend-build:
    name: Frontend Build
    # My Homeberry self-hosted runner: this repo is private, so no GitHub-hosted minutes.
    runs-on: [self-hosted, homeberry]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform-validate:
    name: Terraform Validate
    # My Homeberry self-hosted runner: this repo is private, so no GitHub-hosted minutes.
    runs-on: [self-hosted, homeberry]
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker-build:
    name: Docker Build
    # My Homeberry self-hosted runner: this repo is private, so no GitHub-hosted minutes.
    runs-on: [self-hosted, homeberry]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fiscaliza-test .
