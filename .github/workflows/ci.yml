name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-lint:
    name: Backend Lint
    # My Homeberry self-hosted runner: this repo is private, so no GitHub-hosted minutes.
    runs-on: [self-hosted, homeberry]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  frontend-build:
    name: Frontend Build
    # My Homeberry self-hosted runner: this repo is private, so no GitHub-hosted minutes.
    runs-on: [self-hosted, homeberry]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform-validate:
    name: Terraform Validate
    # My Homeberry self-hosted runner: this repo is private, so no GitHub-hosted minutes.
    runs-on: [self-hosted, homeberry]
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
