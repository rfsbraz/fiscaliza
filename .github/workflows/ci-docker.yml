name: CI (Docker)

# These two jobs need Docker (a postgres:16 service container and docker build),
# which my Homeberry runners do not have, so they stay on GitHub-hosted runners.
# To keep hosted minutes low on this private repo they only run when backend or
# Docker files change.
on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'config/**'
      - 'database/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'alembic.ini'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/ci-docker.yml'
  pull_request:
    branches: [master]
    paths:
      - 'app/**'
      - 'config/**'
      - 'database/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'alembic.ini'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/ci-docker.yml'

jobs:
  backend-test:
    name: Backend Tests
    # Needs Docker, which the Homeberry runners do not have.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: parliament_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov
      - run: pytest --tb=short -q
        env:
          DATABASE_TYPE: postgresql
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: test
          PG_PASSWORD: test
          PG_DATABASE: parliament_test

  docker-build:
    name: Docker Build
    # Needs Docker, which the Homeberry runners do not have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fiscaliza-test .
