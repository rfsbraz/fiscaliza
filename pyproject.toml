[project]
name = "fiscaliza"
version = "1.0.0"
description = "Portuguese Parliament open data analysis platform"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"

[tool.ruff]
target-version = "py312"
line-length = 120
# Explicit paths (editors, pre-commit) respect the excludes below, the same as `ruff check .`.
force-exclude = true
# Legacy script that doesn't parse, so a per-file ignore can't baseline it.
extend-exclude = ["test_analytics_system.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (ok in tests)
    "B008",   # function call in default argument (common in Flask)
    "S110",   # try-except-pass (used intentionally in importers)
    "S603",   # subprocess call (used in ops scripts)
    "S607",   # partial executable path (used in ops scripts)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S603", "S607"]
# Legacy baseline. Each legacy file ignores only the rule codes it already broke when the
# baseline was taken (ruff 0.17.1), so new files get every rule. The migration to
# parlamento-aberto rewrites or deletes these files: drop a line when its file is fixed or gone,
# and never add one for new code.
