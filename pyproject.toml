[project]
name = "fiscaliza"
version = "1.0.0"
description = "Portuguese Parliament open data analysis platform"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"

[tool.ruff]
target-version = "py312"
line-length = 120
# Explicit paths (editors, pre-commit) respect the excludes below, the same as `ruff check .`.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (ok in tests)
    "B008",   # function call in default argument (common in Flask)
    "S603",   # subprocess call (the tests run git and ruff)
    "S607",   # partial executable path (the tests run git and ruff)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Legacy baseline. Each legacy file ignores only the rule codes it already broke when the
# baseline was taken (ruff 0.17.1), so new files get every rule. Drop a line when its file is
# fixed or gone, and never add one for new code.
"tests/__init__.py" = ["W292"]
"tests/conftest.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
# Legacy baseline: files that weren't ruff-formatted when the baseline was taken. Same rule as
# above: drop a line when its file is formatted or deleted, and never add one for new code.
exclude = [
    "tests/__init__.py",
    "tests/conftest.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
